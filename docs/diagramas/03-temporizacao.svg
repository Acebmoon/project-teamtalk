<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Diagrama de temporização do TeamTalk</title>
<desc id="desc">Diagrama com quatro linhas: estado da mensagem, aplicativo remetente, servidor TeamTalk e aplicativo destinatário. Marcos lógicos de zero a sessenta.</desc>
<defs>
  <style>
    .bg{fill:#fff}.heading{font:700 25px Arial,sans-serif;fill:#172033}.sub{font:14px Arial,sans-serif;fill:#586579}
    .lane{fill:#f5f7fb;stroke:#d9e0ea;stroke-width:1}.laneTitle{font:600 16px Arial,sans-serif;fill:#263449}
    .tick{stroke:#d8dee8;stroke-dasharray:4 5}.tickText{font:13px Arial,sans-serif;fill:#526176}
    .state{fill:#e6efff;stroke:#4472c4;stroke-width:1.5}.stateText{font:600 13px Arial,sans-serif;fill:#234b8c}
    .event{fill:#e8f5ed;stroke:#39845a;stroke-width:1.5}.eventText{font:13px Arial,sans-serif;fill:#205b39}
    .note{fill:#fff7e6;stroke:#d6a23b;stroke-width:1.3}.noteText{font:12px Arial,sans-serif;fill:#765314}
    .axis{stroke:#536176;stroke-width:1.5}.arrow{stroke:#526176;stroke-width:1.8;fill:none;marker-end:url(#arr)}
    .small{font:12px Arial,sans-serif;fill:#66758a}
  </style>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#526176" stroke-width="1.2"/></marker>
</defs>
<rect class="bg" width="1200" height="690" rx="14"/>
<text x="42" y="48" class="heading">TeamTalk — Diagrama de temporização</text>
<text x="42" y="75" class="sub">Envio, persistência, disponibilização e visualização de uma mensagem</text>
<text x="42" y="116" class="small">LINHA / PARTICIPANTE</text>
<text x="250" y="116" class="small">MARCOS TEMPORAIS LÓGICOS</text>
<g>
<rect class="lane" x="35" y="135" width="1130" height="105" rx="8"/>
<rect class="lane" x="35" y="250" width="1130" height="105" rx="8"/>
<rect class="lane" x="35" y="365" width="1130" height="105" rx="8"/>
<rect class="lane" x="35" y="480" width="1130" height="105" rx="8"/>
</g>
<g class="laneTitle">
<text x="55" y="175">Estado da mensagem</text>
<text x="55" y="290">Aplicativo remetente</text>
<text x="55" y="405">Servidor TeamTalk</text>
<text x="55" y="520">Aplicativo destinatário</text>
</g>
<g>
<path class="tick" d="M260 130V585 M405 130V585 M550 130V585 M695 130V585 M840 130V585 M985 130V585 M1130 130V585"/>
<g class="tickText" text-anchor="middle">
<text x="260" y="130">@0</text><text x="405" y="130">@10</text><text x="550" y="130">@20</text><text x="695" y="130">@30</text><text x="840" y="130">@40</text><text x="985" y="130">@50</text><text x="1130" y="130">@60</text>
</g>
</g>
<g>
<rect class="state" x="238" y="165" width="100" height="34" rx="7"/><text class="stateText" x="288" y="187" text-anchor="middle">Preparada</text>
<rect class="state" x="375" y="165" width="125" height="34" rx="7"/><text class="stateText" x="437" y="187" text-anchor="middle">Enviando</text>
<rect class="state" x="520" y="165" width="130" height="34" rx="7"/><text class="stateText" x="585" y="187" text-anchor="middle">Em validação</text>
<rect class="state" x="665" y="165" width="100" height="34" rx="7"/><text class="stateText" x="715" y="187" text-anchor="middle">Enviada</text>
<rect class="state" x="810" y="165" width="150" height="34" rx="7"/><text class="stateText" x="885" y="187" text-anchor="middle">Disponível</text>
<rect class="state" x="965" y="165" width="145" height="34" rx="7"/><text class="stateText" x="1037" y="187" text-anchor="middle">Visualizada</text>
</g>
<g>
<rect class="event" x="248" y="270" width="125" height="48" rx="7"/><text class="eventText" x="310" y="289" text-anchor="middle">Composição</text><text class="eventText" x="310" y="306" text-anchor="middle">concluída</text>
<rect class="event" x="382" y="270" width="130" height="48" rx="7"/><text class="eventText" x="447" y="289" text-anchor="middle">Envia requisição</text><text class="eventText" x="447" y="306" text-anchor="middle">HTTPS</text>
<rect class="event" x="665" y="270" width="125" height="48" rx="7"/><text class="eventText" x="727" y="289" text-anchor="middle">Recebe</text><text class="eventText" x="727" y="306" text-anchor="middle">confirmação</text>
<rect class="event" x="965" y="270" width="150" height="48" rx="7"/><text class="eventText" x="1040" y="289" text-anchor="middle">Recebe status</text><text class="eventText" x="1040" y="306" text-anchor="middle">de leitura</text>
</g>
<g>
<rect class="note" x="505" y="382" width="205" height="55" rx="7"/><text class="noteText" x="607" y="403" text-anchor="middle">Valida sessão, permissões</text><text class="noteText" x="607" y="420" text-anchor="middle">e conteúdo</text>
<rect class="event" x="665" y="435" width="125" height="27" rx="6"/><text class="eventText" x="727" y="453" text-anchor="middle">Persiste mensagem</text>
<rect class="event" x="805" y="382" width="175" height="55" rx="7"/><text class="eventText" x="892" y="403" text-anchor="middle">Disponibiliza atualização</text><text class="eventText" x="892" y="420" text-anchor="middle">em tempo real</text>
<rect class="note" x="965" y="435" width="155" height="27" rx="6"/><text class="noteText" x="1042" y="453" text-anchor="middle">Registra visualização</text>
</g>
<g>
<rect class="event" x="805" y="500" width="175" height="48" rx="7"/><text class="eventText" x="892" y="519" text-anchor="middle">Recebe mensagem</text><text class="eventText" x="892" y="536" text-anchor="middle">na conversa</text>
<rect class="event" x="965" y="500" width="150" height="48" rx="7"/><text class="eventText" x="1040" y="519" text-anchor="middle">Funcionário abre</text><text class="eventText" x="1040" y="536" text-anchor="middle">a conversa</text>
</g>
<path class="arrow" d="M447 320V376"/>
<path class="arrow" d="M710 410H800"/>
<path class="arrow" d="M892 440V495"/>
<path class="arrow" d="M1040 495V470"/>
<path class="axis" d="M250 610H1135"/>
<path class="arrow" d="M1135 610l-10 -5v10z"/>
<text x="690" y="637" class="sub" text-anchor="middle">Ordem dos eventos (não representa duração em segundos)</text>
<text x="42" y="670" class="small">Nota: o RNF08 não define meta quantitativa de tempo; os marcos são ilustrativos e não constituem SLA.</text>
</svg>